name: Feature request
description: Suggest a capability or improvement for the XanoScript module.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        The task, not the solution — what you were building when you hit the
        limit.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like this module to do?
      description: >-
        A sketch helps: the command or config you have in mind, or the
        XanoScript you expected to see.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How are you handling it today?
      description: The workaround, if there is one, and where it falls short.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rendering (the XanoScript output)
        - The committed xanoscript/ tree (layout, check, README)
        - Install questions and project config
        - Preflight comparison
        - Other / not sure
    validations:
      required: false
